name: Mantener activo el proyecto de Supabase

# El ping anterior (curl al RPC hay_usuario_configurado cada 3 días) corrió
# sin errores hasta 2 días antes de que Supabase pausara igual el proyecto
# por inactividad, así que simular actividad no alcanza. En vez de eso, este
# workflow consulta el estado real por la Management API y lo reanuda si
# ya quedó pausado.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar estado y reanudar si está pausado
        env:
          TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          REF: lbnqcshwgpgtlpswzsut
        run: |
          status=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://api.supabase.com/v1/projects/$REF" | jq -r '.status')
          echo "Estado actual: $status"
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "Proyecto pausado, reanudando..."
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d '{}' \
              "https://api.supabase.com/v1/projects/$REF/restore"
          fi
